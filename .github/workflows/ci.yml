name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # La primera semana de cada mes vuelve a comprobar vigencia curricular,
  # fuentes oficiales, pruebas y build aunque no haya cambios de código.
  schedule:
    - cron: '17 8 3 * *'
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: |
          cd web
          npm ci
      - name: Build web
        run: |
          cd web
          npm run build --silent
      - name: Test web
        run: |
          cd web
          npm test -- --watch=false --coverage
      - name: Install browser for end-to-end tests
        run: |
          cd web
          npx playwright install --with-deps chromium
      - name: Test complete learning journeys
        run: |
          cd web
          npm run e2e
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install PostgreSQL tools for isolated backup tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Verificar repo graph comprometido
        run: python3 scripts/build_repo_graph.py --check
      - name: Validate repository
        run: ./scripts/validate.sh
      - name: Run text quality check
        run: |
          python3 scripts/fix_lessons.py
        shell: bash

  skills:
    # specs/005: cada skill del repo debe pasar NVIDIA SkillEvaluator (Tier 1) con 80/100 o más.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install SkillEvaluator
        run: pip install skillevaluator
      - name: Evaluate skills
        run: python3 scripts/evaluate_skills.py --min 80
