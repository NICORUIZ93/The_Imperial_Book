name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # specs/023 C7 compara contra un SHA fijo: un clon superficial no lo tiene.
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: |
          cd web
          npm ci
      - name: Build web
        run: |
          cd web
          npm run build --silent
      - name: Test web
        run: |
          cd web
          npm test -- --watch=false --coverage
      - name: Install browser for end-to-end tests
        run: |
          cd web
          npx playwright install --with-deps chromium
      - name: Test complete learning journeys
        run: |
          cd web
          npm run e2e
      - name: Validate repository
        run: ./scripts/validate.sh
