management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents
resilience4j:
  circuitbreaker:
    instances:
      inventory:
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 2
        registerHealthIndicator: true
