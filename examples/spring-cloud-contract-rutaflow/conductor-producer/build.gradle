// Gradle alternativo: mismas fuentes Java y versiones fijadas que pom.xml.
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'org.springframework.cloud.contract' version '5.0.3'
    id 'maven-publish'
}

group = 'academia.rutaflow'
version = '0.1.0-SNAPSHOT'

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    implementation platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.4')
    annotationProcessor platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.4')
    implementation platform('org.springframework.cloud:spring-cloud-contract-dependencies:5.0.3')
    annotationProcessor platform('org.springframework.cloud:spring-cloud-contract-dependencies:5.0.3')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-verifier'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs.add('-parameters')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
    if (providers.gradleProperty('redisIntegration').isPresent()) {
        systemProperty 'redis.integration', 'true'
    }
}

contracts {
    baseClassForTests = 'academia.rutaflow.conductor.ContractBase'
    contractsDslDir = file('src/test/resources/contracts')
    testFramework = org.springframework.cloud.contract.verifier.config.TestFramework.JUNIT5
}
sourceSets.contractTest.java.srcDir('src/test/java')

tasks.named('test') { failOnNoDiscoveredTests = false }
publishing {
    publications {
        stubs(MavenPublication) {
            artifactId = 'conductor-producer'
            artifact tasks.named('verifierStubsJar')
        }
    }
}

tasks.withType(PublishToMavenLocal).configureEach {
    dependsOn tasks.named('contractTest')
}
