# Módulo 23 · F143 · Service: un nombre DNS estable (pedidos.tienda.svc.cluster.local) delante de los pods listos.
apiVersion: v1
kind: Service
metadata:
  name: pedidos
  namespace: tienda
spec:
  type: ClusterIP
  selector: { app: pedidos }
  ports:
    - { name: http, port: 80, targetPort: http }
