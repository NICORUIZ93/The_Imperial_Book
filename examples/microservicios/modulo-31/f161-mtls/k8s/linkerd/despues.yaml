# Módulo 27 · F161 · DESPUÉS con Linkerd (edge-26.11.2): lo mismo que k8s/istio/despues.yaml.
# El namespace lleva la anotación config.linkerd.io/default-inbound-policy: deny (denegar por defecto).
apiVersion: v1
kind: Namespace
metadata:
  name: tienda
  annotations:
    linkerd.io/inject: enabled
    config.linkerd.io/default-inbound-policy: deny
---
apiVersion: policy.linkerd.io/v1beta1
kind: Server
metadata:
  name: pagos-http
  namespace: tienda
spec:
  podSelector:
    matchLabels:
      app: pagos
  port: http
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: solo-pedidos
  namespace: tienda
spec:
  identities:
    - "pedidos.tienda.serviceaccount.identity.linkerd.cluster.local"
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: pagos-solo-pedidos
  namespace: tienda
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: pagos-http
  requiredAuthenticationRefs:
    - name: solo-pedidos
      kind: MeshTLSAuthentication
      group: policy.linkerd.io
