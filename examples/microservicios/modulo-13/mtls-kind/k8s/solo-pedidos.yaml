# Paso extra (autorización por identidad): con mTLS, httpbin sabe QUIÉN llama (su identidad SPIFFE)
# y puede aceptar solo a la cuenta de servicio "curl" del espacio "tienda".
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: solo-curl-de-tienda
  namespace: tienda
spec:
  selector:
    matchLabels:
      app: httpbin
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/tienda/sa/curl"]
