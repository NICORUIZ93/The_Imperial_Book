# Perfil "keycloak" (el del mini-laboratorio): con issuer-uri Spring lee
# /.well-known/openid-configuration al arrancar y además exige que el "iss" del id_token
# sea exactamente este emisor. Requiere Keycloak encendido (docker compose up -d --wait keycloak).
spring:
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${tienda.realm}
