apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "catalogo.fullname" . }}
  labels:
    {{- include "catalogo.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "catalogo.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "catalogo.selector" . | nindent 8 }}
      annotations:
        # Si cambia el ConfigMap, cambia este hash y Kubernetes reinicia los pods (las variables solo se leen al arrancar).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: catalogo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "catalogo.fullname" . }}
          env:
            - name: CATALOGO_CLAVE_API
              valueFrom:
                secretKeyRef:
                  name: {{ include "catalogo.fullname" . }}
                  key: clave-api
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 3
            failureThreshold: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
