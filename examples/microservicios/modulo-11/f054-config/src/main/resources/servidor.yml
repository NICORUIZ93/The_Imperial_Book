server:
  port: 8888
spring:
  application:
    name: config-servidor
  profiles:
    active: native               # lee archivos de una carpeta; en producción: git (por defecto)
  cloud:
    config:
      import-check:
        enabled: false           # el servidor no se pide configuración a sí mismo
      server:
        native:
          search-locations: ${CONFIG_REPO:file:./config-repo/}
