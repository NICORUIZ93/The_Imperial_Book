# Módulo 3 (modulo-7) · Testing y calidad
# Pact Broker:  docker compose up -d --wait pact-broker     -> http://localhost:9292
# SonarQube:    docker compose up -d sonarqube              -> http://localhost:9000 (tarda 1–2 min; necesita ~2 GB de RAM)
# Detén todo:   docker compose down                         (sin volúmenes: contratos y análisis se pierden, a propósito)
# Testcontainers (F033) NO usa este archivo: arranca su propio PostgreSQL desde el test.
services:
  pact-db:
    image: postgres:18.7
    environment:
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact
      POSTGRES_DB: pact
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pact -d pact"]
      interval: 2s
      timeout: 3s
      retries: 30
  pact-broker:
    image: pactfoundation/pact-broker:3.2.0-pactbroker2.124.0   # Pact Broker 2.124.0
    depends_on:
      pact-db:
        condition: service_healthy
    environment:
      PACT_BROKER_DATABASE_URL: postgres://pact:pact@pact-db/pact
      PACT_BROKER_PORT: "9292"
      PACT_BROKER_LOG_LEVEL: INFO
    ports: ["9292:9292"]
    healthcheck:
      # la imagen trae Ruby: se usa para no depender de curl dentro del contenedor
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://localhost:9292/diagnostic/status/heartbeat')).code == '200' ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 40
  sonarqube:
    image: sonarqube:26.11.0.134175-community
    environment:
      # desactiva las comprobaciones de arranque de Elasticsearch (vm.max_map_count): solo para laboratorio
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports: ["9000:9000"]
