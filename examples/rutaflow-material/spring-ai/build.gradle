// Gradle alternativo: mismas fuentes Java y versiones fijadas que pom.xml.
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.9'
}

group = 'academia'
version = '1'

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.9')
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:4.0.9')
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.2')
    annotationProcessor platform('org.springframework.ai:spring-ai-bom:2.0.2')
    implementation 'org.springframework.ai:spring-ai-client-chat'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs.add('-parameters')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
    if (providers.gradleProperty('redisIntegration').isPresent()) {
        systemProperty 'redis.integration', 'true'
    }
}
