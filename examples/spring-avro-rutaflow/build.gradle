// Gradle alternativo: mismas fuentes Java y versiones fijadas que pom.xml.
plugins {
    id 'java'
}

group = 'academia.rutaflow'
version = '0.1.0'

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = uri('https://packages.confluent.io/maven/') }
}

dependencies {
    implementation platform('org.junit:junit-bom:5.12.2')
    annotationProcessor platform('org.junit:junit-bom:5.12.2')
    implementation 'org.apache.avro:avro:1.12.0'
    implementation 'io.confluent:kafka-avro-serializer:7.9.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs.add('-parameters')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
    if (providers.gradleProperty('redisIntegration').isPresent()) {
        systemProperty 'redis.integration', 'true'
    }
}
