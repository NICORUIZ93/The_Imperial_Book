// Gradle alternativo: mismas fuentes Java y versiones fijadas que pom.xml.
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'com.google.protobuf' version '0.9.5'
}

group = 'academia.rutaflow'
version = '0.1.0'

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    implementation 'org.springframework.boot:spring-boot-starter-grpc-server'
    implementation 'org.springframework.boot:spring-boot-starter-grpc-client'
    testImplementation 'org.springframework.boot:spring-boot-starter-grpc-server-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs.add('-parameters')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
    if (providers.gradleProperty('redisIntegration').isPresent()) {
        systemProperty 'redis.integration', 'true'
    }
}

protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:4.36.2' }
    plugins { grpc { artifact = 'io.grpc:protoc-gen-grpc-java:1.84.1' } }
    generateProtoTasks { all().configureEach { plugins { grpc {} } } }
}
