apiVersion: apps/v1
kind: Deployment
metadata:
  name: rutaflow-probes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rutaflow-probes
  template:
    metadata:
      labels:
        app: rutaflow-probes
    spec:
      containers:
        - name: rutaflow
          image: rutaflow-probes:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 2
