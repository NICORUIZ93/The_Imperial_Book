<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control de flujo: decisión, repetición, salida</title><style>
:root{--bg:#fbfaf7;--ink:#1f2937;--muted:#6b7280;--line:#d7dbe2;--accent:#b45309;--accent2:#0f766e;--panel:#ffffff;--soft:#f3f4f6;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:28px}
h1{font-size:28px;line-height:1.2;margin:0 0 6px} .lead{color:var(--muted);margin:0 0 20px;max-width:78ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
svg{width:100%;height:auto;display:block}
.note{margin-top:14px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion: reduce){.anim,.pulse,.flow,.dash{animation:none !important;transition:none !important}}
</style></head><body><main class="wrap">
<h1>Control de flujo: decisión, repetición, salida</h1><p class="lead">Qué debe entender: if/switch eligen, loops repiten, guard clauses salen temprano.</p>
<section class="card" aria-label="Control de flujo: decisión, repetición, salida"><svg viewBox="0 0 960 260" role="img" aria-label="Control de flujo">
<defs><marker id="m2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker></defs>
<rect x="60" y="100" width="150" height="56" rx="12" fill="#fff" stroke="#d7dbe2"/><text x="135" y="133" text-anchor="middle" font-weight="700">Entrada</text>
<polygon points="300,128 360,88 420,128 360,168" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="360" y="133" text-anchor="middle" font-size="13" font-weight="700">condición</text>
<rect x="500" y="50" width="150" height="56" rx="12" fill="#fff" stroke="#d7dbe2"/><text x="575" y="83" text-anchor="middle" font-weight="700">rama A</text>
<rect x="500" y="150" width="150" height="56" rx="12" fill="#fff" stroke="#d7dbe2"/><text x="575" y="183" text-anchor="middle" font-weight="700">rama B / loop</text>
<rect x="730" y="100" width="150" height="56" rx="12" fill="#fff" stroke="#d7dbe2"/><text x="805" y="133" text-anchor="middle" font-weight="700">Salida</text>
<line x1="210" y1="128" x2="295" y2="128" stroke="#6b7280" stroke-width="2" marker-end="url(#m2)"/>
<line x1="405" y1="108" x2="495" y2="78" stroke="#6b7280" stroke-width="2" marker-end="url(#m2)"/>
<line x1="405" y1="148" x2="495" y2="178" stroke="#6b7280" stroke-width="2" marker-end="url(#m2)"/>
<line x1="650" y1="78" x2="725" y2="115" stroke="#6b7280" stroke-width="2" marker-end="url(#m2)"/>
<line x1="650" y1="178" x2="725" y2="140" stroke="#6b7280" stroke-width="2" marker-end="url(#m2)"/>
<path d="M575 206 C575 235,360 235,360 173" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#m2)"/>
<text x="470" y="242" text-anchor="middle" font-size="12" fill="#6b7280">bucle: vuelve a evaluar condición</text>
</svg></section>
<p class="note"><strong>Lectura:</strong> El flujo se bifurca por condiciones y puede volver atrás en bucles. La guard clause es un caso especial: sale temprano ante condición inválida.</p>
</main></body></html>
