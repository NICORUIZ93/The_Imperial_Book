<h1>I/O: fuente, stream/canal, destino</h1><p class="lead">Qué debe entender: I/O mueve bytes/caracteres entre programa y sistema externo con buffering y cierre.</p>
<section class="card" aria-label="I/O: fuente, stream/canal, destino"><svg viewBox="0 0 960 220" role="img" aria-label="IO NIO">
<defs><marker id="m10" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker></defs>
<rect x="70" y="75" width="170" height="70" rx="14" fill="#fff" stroke="#d7dbe2"/><text x="155" y="115" text-anchor="middle" font-weight="700">Archivo/Socket</text>
<rect x="320" y="75" width="170" height="70" rx="14" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="405" y="108" text-anchor="middle" font-weight="700">Stream/Channel</text><text x="405" y="128" text-anchor="middle" font-size="12" fill="#6b7280">buffer + charset</text>
<rect x="570" y="75" width="170" height="70" rx="14" fill="#fff" stroke="#d7dbe2"/><text x="655" y="115" text-anchor="middle" font-weight="700">Aplicación</text>
<line x1="240" y1="110" x2="315" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#m10)"/>
<line x1="490" y1="110" x2="565" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#m10)"/>
</svg></section>
<p class="note"><strong>Lectura:</strong> I/O clásico usa streams; NIO usa buffers/canales. En ambos: gestiona charset, buffering y cierre de recursos.</p>
