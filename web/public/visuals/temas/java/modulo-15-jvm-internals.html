<h1>JVM: class loading, runtime, GC/JIT</h1><p class="lead">Qué debe entender: la JVM carga clases, ejecuta bytecode y optimiza/recupera memoria en runtime.</p>
<section class="card" aria-label="JVM: class loading, runtime, GC/JIT"><svg viewBox="0 0 960 240" role="img" aria-label="JVM internals">
<defs><marker id="m15" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker></defs>
<rect x="50" y="85" width="160" height="70" rx="14" fill="#fff" stroke="#d7dbe2"/><text x="130" y="115" text-anchor="middle" font-weight="700">Class Loader</text>
<rect x="260" y="85" width="160" height="70" rx="14" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="340" y="115" text-anchor="middle" font-weight="700">Runtime</text><text x="340" y="133" text-anchor="middle" font-size="12" fill="#6b7280">heap/stack/metaspace</text>
<rect x="470" y="85" width="160" height="70" rx="14" fill="#fff" stroke="#d7dbe2"/><text x="550" y="115" text-anchor="middle" font-weight="700">JIT/GC</text>
<rect x="680" y="85" width="160" height="70" rx="14" fill="#fff" stroke="#d7dbe2"/><text x="760" y="115" text-anchor="middle" font-weight="700">Observabilidad</text><text x="760" y="133" text-anchor="middle" font-size="12" fill="#6b7280">JFR/logs/metrics</text>

<line x1="420" y1="120" x2="465" y2="120" stroke="#6b7280" stroke-width="2" marker-end="url(#m15)"/>
<line x1="630" y1="120" x2="675" y2="120" stroke="#6b7280" stroke-width="2" marker-end="url(#m15)"/>
</svg></section>
<p class="note"><strong>Lectura:</strong> La JVM no solo “ejecuta”: carga, verifica, optimiza con JIT, gestiona memoria con GC y expone señales para observar.</p>
