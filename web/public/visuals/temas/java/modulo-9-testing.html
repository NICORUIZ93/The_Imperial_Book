<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Testing Java: JUnit, Mockito y propiedades</title>
<style>
:root{--bg:#fbfaf7;--ink:#1f2937;--muted:#6b7280;--line:#d7dbe2;--accent:#b45309;--ok:#0f766e;--panel:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:28px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
h1{margin:0 0 6px;font-size:28px}.lead{margin:0 0 18px;color:var(--muted)}svg{width:100%;height:auto;display:block}.note{color:var(--muted);font-size:14px;margin-top:14px}
</style></head><body><main class="wrap">
<h1>Pruebas: feedback rápido y contratos confiables</h1>
<p class="lead">Unit tests verifican reglas, dobles aíslan dependencias, parametrizados cubren casos y propiedades verifican invariantes generales.</p>
<section class="card">
<svg viewBox="0 0 980 300" role="img" aria-label="Pirámide y tipos de pruebas Java">
<rect x="70" y="60" width="190" height="80" rx="14" fill="#fff" stroke="#d7dbe2"/><text x="165" y="90" text-anchor="middle" font-weight="700">JUnit/Jupiter</text><text x="165" y="114" text-anchor="middle" font-size="12" fill="#6b7280">ciclo de vida y assertions</text>
<rect x="290" y="60" width="190" height="80" rx="14" fill="#fff" stroke="#d7dbe2"/><text x="385" y="90" text-anchor="middle" font-weight="700">Mockito</text><text x="385" y="114" text-anchor="middle" font-size="12" fill="#6b7280">dobles para puertos</text>
<rect x="510" y="60" width="190" height="80" rx="14" fill="#fff" stroke="#d7dbe2"/><text x="605" y="90" text-anchor="middle" font-weight="700">Parametrizados</text><text x="605" y="114" text-anchor="middle" font-size="12" fill="#6b7280">tabla de casos</text>
<rect x="730" y="60" width="180" height="80" rx="14" fill="#fff" stroke="#d7dbe2"/><text x="820" y="90" text-anchor="middle" font-weight="700">jqwik</text><text x="820" y="114" text-anchor="middle" font-size="12" fill="#6b7280">propiedades/invariantes</text>
<rect x="210" y="200" width="560" height="60" rx="14" fill="#f8fafc" stroke="#d7dbe2"/><text x="490" y="226" text-anchor="middle" font-size="13" fill="#374151"><tspan font-weight="700">Regla:</tspan> probar comportamiento observable, aislar I/O, y no usar mocks donde un valor real es simple.</text>
</svg>
</section>
<p class="note"><strong>Lectura:</strong> una suite sana mezcla unit rápida, dobles bien usados y algunos invariantes basados en propiedades.</p>
</main></body></html>
