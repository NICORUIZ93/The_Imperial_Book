<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Excepciones: detectar, propagar, manejar en borde</title><style>
:root{--bg:#fbfaf7;--ink:#1f2937;--muted:#6b7280;--line:#d7dbe2;--accent:#b45309;--accent2:#0f766e;--panel:#ffffff;--soft:#f3f4f6;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:28px}
h1{font-size:28px;line-height:1.2;margin:0 0 6px} .lead{color:var(--muted);margin:0 0 20px;max-width:78ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
svg{width:100%;height:auto;display:block}
.note{margin-top:14px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion: reduce){.anim,.pulse,.flow,.dash{animation:none !important;transition:none !important}}
</style></head><body><main class="wrap">
<h1>Excepciones: detectar, propagar, manejar en borde</h1><p class="lead">Qué debe entender: lanza con contexto, no tragues errores, maneja donde hay decisión útil.</p>
<section class="card" aria-label="Excepciones: detectar, propagar, manejar en borde"><svg viewBox="0 0 960 240" role="img" aria-label="Excepciones">
<defs><marker id="m7" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker></defs>
<rect x="60" y="90" width="170" height="60" rx="12" fill="#fff" stroke="#d7dbe2"/><text x="145" y="125" text-anchor="middle" font-weight="700">Dominio/IO</text>
<rect x="300" y="90" width="170" height="60" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="385" y="125" text-anchor="middle" font-weight="700">throw excepción</text>
<rect x="540" y="90" width="170" height="60" rx="12" fill="#fff" stroke="#d7dbe2"/><text x="625" y="125" text-anchor="middle" font-weight="700">propaga</text>
<rect x="780" y="90" width="120" height="60" rx="12" fill="#fff" stroke="#0f766e"/><text x="840" y="125" text-anchor="middle" font-weight="700">borde</text>
<line x1="230" y1="120" x2="295" y2="120" stroke="#6b7280" stroke-width="2" marker-end="url(#m7)"/>
<line x1="470" y1="120" x2="535" y2="120" stroke="#6b7280" stroke-width="2" marker-end="url(#m7)"/>
<line x1="710" y1="120" x2="775" y2="120" stroke="#6b7280" stroke-width="2" marker-end="url(#m7)"/>
<text x="480" y="190" text-anchor="middle" font-size="13" fill="#6b7280">El borde (UI/API/main) decide: reintentar, traducir, loguear o fallar.</text>
</svg></section>
<p class="note"><strong>Lectura:</strong> No captures si no puedes decidir. Propaga con contexto y maneja en el borde donde existe una respuesta útil.</p>
</main></body></html>
