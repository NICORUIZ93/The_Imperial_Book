<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patrones de diseño en Java</title>
<style>
:root{--bg:#fbfaf7;--ink:#1f2937;--muted:#6b7280;--line:#d7dbe2;--accent:#b45309;--ok:#0f766e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:28px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
h1{margin:0 0 6px;font-size:28px}.lead{margin:0 0 18px;color:var(--muted)}svg{width:100%;height:auto;display:block}.note{color:var(--muted);font-size:14px;margin-top:14px}
</style></head><body><main class="wrap">
<h1>Patrones: intención antes que UML</h1>
<p class="lead">Cada patrón responde a una presión de cambio distinta. Si no hay presión real, el patrón agrega complejidad.</p>
<section class="card">
<svg viewBox="0 0 980 360" role="img" aria-label="Patrones por intención">
<defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker></defs>
<rect x="30" y="30" width="290" height="90" rx="14" fill="#fff" stroke="#d7dbe2"/><text x="175" y="58" text-anchor="middle" font-weight="700">Creación</text><text x="175" y="82" text-anchor="middle" font-size="12" fill="#6b7280">Builder · Factory Method · Abstract Factory · Prototype</text><text x="175" y="102" text-anchor="middle" font-size="12" fill="#b45309">¿Cómo construyo sin acoplarme?</text>
<rect x="345" y="30" width="290" height="90" rx="14" fill="#fff" stroke="#d7dbe2"/><text x="490" y="58" text-anchor="middle" font-weight="700">Comportamiento</text><text x="490" y="82" text-anchor="middle" font-size="12" fill="#6b7280">Strategy</text><text x="490" y="102" text-anchor="middle" font-size="12" fill="#b45309">¿Cómo varío un algoritmo?</text>
<rect x="660" y="30" width="290" height="90" rx="14" fill="#fff" stroke="#d7dbe2"/><text x="805" y="58" text-anchor="middle" font-weight="700">Estructura</text><text x="805" y="82" text-anchor="middle" font-size="12" fill="#6b7280">Adapter · Decorator · Facade</text><text x="805" y="102" text-anchor="middle" font-size="12" fill="#b45309">¿Cómo integro/simplifico?</text>
<rect x="140" y="190" width="700" height="120" rx="16" fill="#f8fafc" stroke="#d7dbe2"/>
<text x="490" y="225" text-anchor="middle" font-weight="700">Criterio de uso</text>
<text x="490" y="252" text-anchor="middle" font-size="13" fill="#0f766e">Problema real + presión de cambio + prueba que lo justifique</text>
<text x="490" y="278" text-anchor="middle" font-size="13" fill="#9a3412">Evitar patrón por moda: añade clases, indirección y costo cognitivo</text>
<line x1="175" y1="120" x2="300" y2="190" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="490" y1="120" x2="490" y2="190" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="805" y1="120" x2="680" y2="190" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
</section>
<p class="note"><strong>Lectura:</strong> primero identifica la presión de cambio; luego elige el patrón cuya intención encaja. El test debe demostrar el beneficio.</p>
</main></body></html>
