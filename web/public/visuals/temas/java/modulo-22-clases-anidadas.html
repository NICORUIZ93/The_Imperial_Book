<h1>Clases anidadas: quién captura this$0</h1><p class="lead">Qué debe entender: una inner class no estática captura la instancia externa; la static nested no.</p>
<section class="card" aria-label="Clases anidadas: quién captura this$0"><svg viewBox="0 0 960 240" role="img" aria-label="Clases anidadas">
<defs><marker id="a14" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker></defs>
<rect x="90" y="85" width="220" height="80" rx="14" fill="#fff" stroke="#d7dbe2"/><text x="200" y="120" text-anchor="middle" font-size="18" font-weight="700">Outer instancia</text><text x="200" y="142" text-anchor="middle" font-size="12" fill="#6b7280">estado externo</text>
<rect x="430" y="40" width="220" height="80" rx="14" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="540" y="75" text-anchor="middle" font-size="17" font-weight="700">Inner no estática</text><text x="540" y="97" text-anchor="middle" font-size="12" fill="#b45309">captura this$0</text>
<rect x="430" y="140" width="220" height="80" rx="14" fill="#fff" stroke="#0f766e"/><text x="540" y="175" text-anchor="middle" font-size="17" font-weight="700">Static nested</text><text x="540" y="197" text-anchor="middle" font-size="12" fill="#0f766e">sin captura implícita</text>
<line x1="310" y1="110" x2="425" y2="80" stroke="#b45309" stroke-width="2" marker-end="url(#a14)"/><line x1="425" y1="95" x2="315" y2="125" stroke="#b45309" stroke-width="2" marker-end="url(#a14)"/>
<line x1="310" y1="140" x2="425" y2="175" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a14)"/><text x="360" y="170" font-size="12" fill="#6b7280">sin this$0</text>
</svg></section>
<p class="note"><strong>Lectura:</strong> La inner class tiene referencia implícita al outer; la static nested no. Esto importa para GC, serialización y diseño.</p>
