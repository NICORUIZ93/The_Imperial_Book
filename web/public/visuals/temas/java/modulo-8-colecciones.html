<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colecciones: elegir estructura por operación dominante</title><style>
:root{--bg:#fbfaf7;--ink:#1f2937;--muted:#6b7280;--line:#d7dbe2;--accent:#b45309;--accent2:#0f766e;--panel:#ffffff;--soft:#f3f4f6;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:28px}
h1{font-size:28px;line-height:1.2;margin:0 0 6px} .lead{color:var(--muted);margin:0 0 20px;max-width:78ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
svg{width:100%;height:auto;display:block}
.note{margin-top:14px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion: reduce){.anim,.pulse,.flow,.dash{animation:none !important;transition:none !important}}
</style></head><body><main class="wrap">
<h1>Colecciones: elegir estructura por operación dominante</h1><p class="lead">Qué debe entender: List, Set, Map y Queue optimizan accesos distintos.</p>
<section class="card" aria-label="Colecciones: elegir estructura por operación dominante"><svg viewBox="0 0 960 250" role="img" aria-label="Colecciones">
<rect x="50" y="70" width="190" height="90" rx="14" fill="#fff" stroke="#d7dbe2"/><text x="145" y="105" text-anchor="middle" font-weight="700">List</text><text x="145" y="128" text-anchor="middle" font-size="12" fill="#6b7280">orden, duplicados</text>
<rect x="270" y="70" width="190" height="90" rx="14" fill="#fff" stroke="#d7dbe2"/><text x="365" y="105" text-anchor="middle" font-weight="700">Set</text><text x="365" y="128" text-anchor="middle" font-size="12" fill="#6b7280">unicidad</text>
<rect x="490" y="70" width="190" height="90" rx="14" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="585" y="105" text-anchor="middle" font-weight="700">Map</text><text x="585" y="128" text-anchor="middle" font-size="12" fill="#6b7280">clave -> valor</text>
<rect x="710" y="70" width="190" height="90" rx="14" fill="#fff" stroke="#d7dbe2"/><text x="805" y="105" text-anchor="middle" font-weight="700">Queue/Deque</text><text x="805" y="128" text-anchor="middle" font-size="12" fill="#6b7280">FIFO/LIFO</text>
<text x="480" y="200" text-anchor="middle" font-size="13" fill="#6b7280">Elige por operación dominante: búsqueda por clave, unicidad, orden o cola.</text>
</svg></section>
<p class="note"><strong>Lectura:</strong> No hay colección universal. La elección depende de acceso por índice, clave, unicidad o comportamiento FIFO/LIFO.</p>
</main></body></html>
