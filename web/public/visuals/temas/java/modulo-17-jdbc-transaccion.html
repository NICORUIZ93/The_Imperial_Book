<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JDBC y transacciones</title>
<style>
:root{--bg:#fbfaf7;--ink:#1f2937;--muted:#6b7280;--line:#d7dbe2;--accent:#b45309;--ok:#0f766e;--bad:#9a3412}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:28px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
h1{margin:0 0 6px;font-size:28px}.lead{margin:0 0 18px;color:var(--muted)}

<h1>JDBC, DAO y transacción</h1>
<p class="lead">El DAO traduce objetos a SQL con PreparedStatement; la transacción decide si todos los cambios se confirman o se revierten.</p>
<section class="card">
<svg viewBox="0 0 980 320" role="img" aria-label="JDBC DAO transacción">
<defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker></defs>
<rect x="30" y="70" width="150" height="70" rx="14" fill="#fff" stroke="#d7dbe2"/><text x="105" y="100" text-anchor="middle" font-weight="700">App/Servicio</text><text x="105" y="122" text-anchor="middle" font-size="12" fill="#6b7280">regla de negocio</text>
<rect x="220" y="70" width="150" height="70" rx="14" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="295" y="100" text-anchor="middle" font-weight="700">DAO</text><text x="295" y="122" text-anchor="middle" font-size="12" fill="#6b7280">SQL + mapping</text>
<rect x="410" y="70" width="170" height="70" rx="14" fill="#fff" stroke="#d7dbe2"/><text x="495" y="100" text-anchor="middle" font-weight="700">PreparedStatement</text><text x="495" y="122" text-anchor="middle" font-size="12" fill="#6b7280">parámetros tipados</text>
<rect x="620" y="55" width="150" height="100" rx="14" fill="#fff" stroke="#d7dbe2"/><text x="695" y="102" text-anchor="middle" font-weight="700">BD</text><text x="695" y="124" text-anchor="middle" font-size="12" fill="#6b7280">tablas/constraints</text>
<line x1="180" y1="105" x2="215" y2="105" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
<line x1="370" y1="105" x2="405" y2="105" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
<line x1="580" y1="105" x2="615" y2="105" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
<rect x="220" y="210" width="550" height="80" rx="14" fill="#f8fafc" stroke="#d7dbe2"/>
<text x="495" y="238" text-anchor="middle" font-weight="700">Transacción</text>
<text x="360" y="262" text-anchor="middle" font-size="13" fill="#0f766e">commit: todo persiste</text>
<text x="630" y="262" text-anchor="middle" font-size="13" fill="#9a3412">rollback: nada parcial</text>
<line x1="495" y1="140" x2="495" y2="205" stroke="#b45309" stroke-width="2" marker-end="url(#a)"/>
</svg>
</section>
<p class="note"><strong>Lectura:</strong> el código de negocio llama al DAO; el DAO usa JDBC con parámetros; la transacción envuelve varias operaciones para garantizar atomicidad.</p>
</main></body></html>
