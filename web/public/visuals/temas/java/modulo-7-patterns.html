<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sealed classes y pattern matching</title>
<style>
:root{--bg:#fbfaf7;--ink:#1f2937;--muted:#6b7280;--line:#d7dbe2;--accent:#b45309;--ok:#0f766e;--panel:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:28px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
h1{margin:0 0 6px;font-size:28px}.lead{margin:0 0 18px;color:var(--muted)}svg{width:100%;height:auto;display:block}.note{color:var(--muted);font-size:14px;margin-top:14px}
</style></head><body><main class="wrap">
<h1>Modelar con tipos cerrados y patrones exhaustivos</h1>
<p class="lead">sealed limita subtipos; records transportan datos; pattern matching desestructura y obliga a cubrir casos.</p>
<section class="card">
<svg viewBox="0 0 980 300" role="img" aria-label="Sealed pattern matching">
<rect x="390" y="30" width="200" height="60" rx="12" fill="#fff" stroke="#d7dbe2"/><text x="490" y="65" text-anchor="middle" font-weight="700">sealed Pago</text>
<line x1="490" y1="90" x2="490" y2="120" stroke="#6b7280"/><line x1="200" y1="120" x2="780" y2="120" stroke="#6b7280"/>
<line x1="200" y1="120" x2="200" y2="150" stroke="#6b7280"/><line x1="490" y1="120" x2="490" y2="150" stroke="#6b7280"/><line x1="780" y1="120" x2="780" y2="150" stroke="#6b7280"/>
<rect x="110" y="150" width="180" height="60" rx="12" fill="#fff" stroke="#d7dbe2"/><text x="200" y="185" text-anchor="middle">PagoTarjeta</text>
<rect x="400" y="150" width="180" height="60" rx="12" fill="#fff" stroke="#d7dbe2"/><text x="490" y="185" text-anchor="middle">PagoTransferencia</text>
<rect x="690" y="150" width="180" height="60" rx="12" fill="#fff" stroke="#d7dbe2"/><text x="780" y="185" text-anchor="middle">PagoEfectivo</text>
<rect x="220" y="235" width="540" height="45" rx="12" fill="#f8fafc" stroke="#d7dbe2"/><text x="490" y="262" text-anchor="middle" font-size="13" fill="#0f766e">switch exhaustivo + record pattern + _ para ignorar componentes</text>
</svg>
</section>
<p class="note"><strong>Lectura:</strong> si agregas un subtipo permitido, el switch exhaustivo deja de compilar hasta cubrirlo.</p>
</main></body></html>
