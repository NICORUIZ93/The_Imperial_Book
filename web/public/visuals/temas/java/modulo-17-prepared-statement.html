<h1>PreparedStatement: SQL y datos viajan separados</h1><p class="lead">Qué debe entender: el parámetro no se concatena como SQL; el driver lo envía tipado.</p>
<section class="card" aria-label="PreparedStatement: SQL y datos viajan separados"><svg viewBox="0 0 960 260" role="img" aria-label="PreparedStatement">
<defs><marker id="a2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker></defs>
<rect x="40" y="50" width="230" height="160" rx="14" fill="#fff" stroke="#d7dbe2"/>
<text x="155" y="82" text-anchor="middle" font-size="18" font-weight="700">App</text>
<text x="60" y="115" font-size="13" fill="#374151">prepare(SQL con ?)</text>
<text x="60" y="140" font-size="13" fill="#374151">setInt(1, 42)</text>
<text x="60" y="165" font-size="13" fill="#374151">executeQuery()</text>
<rect x="350" y="70" width="250" height="120" rx="14" fill="#fff" stroke="#b45309" stroke-width="2"/>
<text x="475" y="100" text-anchor="middle" font-size="18" font-weight="700">PreparedStatement</text>
<text x="475" y="128" text-anchor="middle" font-size="13" fill="#6b7280">SQL template + parámetro tipado</text>
<text x="475" y="152" text-anchor="middle" font-size="13" fill="#b45309" font-weight="700">No concatenar input</text>
<rect x="690" y="60" width="220" height="140" rx="14" fill="#fff" stroke="#d7dbe2"/>
<text x="800" y="95" text-anchor="middle" font-size="18" font-weight="700">Base de datos</text>
<text x="800" y="125" text-anchor="middle" font-size="13" fill="#6b7280">recibe plan/SQL + valor</text>
<text x="800" y="150" text-anchor="middle" font-size="13" fill="#6b7280">devuelve ResultSet</text>
<line x1="270" y1="130" x2="345" y2="130" stroke="#6b7280" stroke-width="2" marker-end="url(#a2)"/>
<line x1="600" y1="130" x2="685" y2="130" stroke="#6b7280" stroke-width="2" marker-end="url(#a2)"/>
<line x1="685" y1="155" x2="605" y2="155" stroke="#9ca3af" stroke-width="2" marker-end="url(#a2)"/>
<line x1="345" y1="155" x2="275" y2="155" stroke="#9ca3af" stroke-width="2" marker-end="url(#a2)"/>
</svg></section>
<p class="note"><strong>Lectura:</strong> El SQL se prepara con placeholders y los valores viajan como parámetros. Esto reduce riesgo de inyección y hace el contrato de tipos explícito.</p>
