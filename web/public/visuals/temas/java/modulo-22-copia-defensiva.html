<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copia defensiva: proteger el estado interno</title><style>
:root{--bg:#fbfaf7;--ink:#1f2937;--muted:#6b7280;--line:#d7dbe2;--accent:#b45309;--accent2:#0f766e;--panel:#ffffff;--soft:#f3f4f6;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:28px}
h1{font-size:28px;line-height:1.2;margin:0 0 6px} .lead{color:var(--muted);margin:0 0 20px;max-width:78ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
svg{width:100%;height:auto;display:block}
.note{margin-top:14px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion: reduce){.anim,.pulse,.flow,.dash{animation:none !important;transition:none !important}}
</style></head><body><main class="wrap">
<h1>Copia defensiva: proteger el estado interno</h1><p class="lead">Qué debe entender: si expones una colección mutable interna, el llamador puede romper invariantes.</p>
<section class="card" aria-label="Copia defensiva: proteger el estado interno"><svg viewBox="0 0 960 240" role="img" aria-label="Copia defensiva">
<defs><marker id="a13" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker></defs>
<rect x="80" y="70" width="280" height="100" rx="14" fill="#fff" stroke="#d7dbe2"/><text x="220" y="105" text-anchor="middle" font-size="18" font-weight="700">Objeto dominio</text><text x="220" y="130" text-anchor="middle" font-size="13" fill="#6b7280">List interna mutable</text>
<rect x="560" y="70" width="280" height="100" rx="14" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="700" y="105" text-anchor="middle" font-size="18" font-weight="700">Cliente</text><text x="700" y="130" text-anchor="middle" font-size="13" fill="#6b7280">recibe copia/inmutable</text>
<line x1="360" y1="120" x2="555" y2="120" stroke="#0f766e" stroke-width="2" marker-end="url(#a13)"/><text x="458" y="110" text-anchor="middle" font-size="12" fill="#0f766e">getter devuelve copia</text>
<line x1="560" y1="145" x2="365" y2="145" stroke="#b45309" stroke-width="2" stroke-dasharray="6 6"/><text x="458" y="162" text-anchor="middle" font-size="12" fill="#b45309">no muta el interno</text>
</svg></section>
<p class="note"><strong>Lectura:</strong> El objeto no entrega su referencia interna mutable; entrega copia o vista inmutable. Así conserva sus invariantes.</p>
</main></body></html>
