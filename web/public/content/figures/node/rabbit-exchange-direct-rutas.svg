<text x="18" y="574" style="white-space: pre" fill="#e6e6e6">total cola=repartidor rechazos=0</text>
<text x="18" y="593" style="white-space: pre"><tspan fill="#7dd3a8">$ </tspan><tspan fill="#e6e6e6">COLA=facturacion SEGUNDOS=5 node trabajar.mjs</tspan></text>
<text x="18" y="612" style="white-space: pre" fill="#e6e6e6">recibido cola=facturacion rk=entregada redelivered=false cuerpo={"pedido":"1","total":4200}</text>
