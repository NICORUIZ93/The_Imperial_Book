<text x="18" y="460" style="white-space: pre" fill="#e6e6e6">facturacion.muertos    0</text>
<text x="18" y="479" style="white-space: pre"><tspan fill="#7dd3a8">$ </tspan><tspan fill="#e6e6e6">COLA=repartidor SEGUNDOS=5 node trabajar.mjs</tspan></text>
<text x="18" y="498" style="white-space: pre" fill="#e6e6e6">recibido cola=repartidor rk=asignada redelivered=false cuerpo={"pedido":"1","conductor":"ana"}</text>
<text x="18" y="517" style="white-space: pre" fill="#e6e6e6">procesado cola=repartidor rk=asignada pedido=1</text>
<text x="18" y="536" style="white-space: pre" fill="#e6e6e6">recibido cola=repartidor rk=cancelada redelivered=false cuerpo={"pedido":"2","motivo":"cliente"}</text>
