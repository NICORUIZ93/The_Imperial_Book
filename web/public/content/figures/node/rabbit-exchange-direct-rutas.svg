<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 674" width="794" height="674" role="img" aria-label="Captura de terminal: un exchange directo reparte por clave de enrutado">
<title>Captura de terminal: un exchange directo reparte por clave de enrutado</title>
<desc>Generado con scripts/render_terminal_capture.py el 2026-11-19. Comandos capturados en orden: node topologia.mjs ; docker exec liebre rabbitmqctl list_bindings | grep rutaflow ; node producir.mjs ; docker exec liebre rabbitmqctl list_queues name messages | grep -v Listing ; COLA=repartidor SEGUNDOS=5 node trabajar.mjs ; COLA=facturacion SEGUNDOS=5 node trabajar.mjs. Codigo de salida final: 0.</desc>
<rect width="794" height="674" rx="8" fill="#1e1f24"/>
<rect width="794" height="30" rx="8" fill="#2b2d33"/><rect y="22" width="794" height="8" fill="#2b2d33"/><circle cx="18" cy="15.0" r="5.5" fill="#ff5f57"/><circle cx="36" cy="15.0" r="5.5" fill="#febc2e"/><circle cx="54" cy="15.0" r="5.5" fill="#28c840"/>
<text x="397.0" y="19.0" text-anchor="middle" fill="#9aa0a6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">un exchange directo reparte por clave de enrutado</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve" style="white-space: pre">
<text x="18" y="61" style="white-space: pre"><tspan fill="#7dd3a8">$ </tspan><tspan fill="#e6e6e6">node topologia.mjs</tspan></text>
<text x="18" y="80" style="white-space: pre" fill="#e6e6e6">cola repartidor -&gt; [asignada, cancelada] dlq repartidor.muertos</text>
<text x="18" y="99" style="white-space: pre" fill="#e6e6e6">cola facturacion -&gt; [entregada] dlq facturacion.muertos</text>
<text x="18" y="118" style="white-space: pre" fill="#e6e6e6">exchange rutaflow.entregos (direct) y rutaflow.muertos (direct) declarados</text>
<text x="18" y="137" style="white-space: pre"><tspan fill="#7dd3a8">$ </tspan><tspan fill="#e6e6e6">docker exec liebre rabbitmqctl list_bindings | grep rutaflow</tspan></text>
<text x="18" y="156" style="white-space: pre" fill="#e6e6e6">rutaflow.muertos    exchange    repartidor.muertos    queue    repartidor    []</text>
<text x="18" y="175" style="white-space: pre" fill="#e6e6e6">rutaflow.entregos    exchange    facturacion    queue    entregada    []</text>
<text x="18" y="194" style="white-space: pre" fill="#e6e6e6">rutaflow.entregos    exchange    repartidor    queue    cancelada    []</text>
<text x="18" y="213" style="white-space: pre" fill="#e6e6e6">rutaflow.entregos    exchange    repartidor    queue    asignada    []</text>
<text x="18" y="232" style="white-space: pre" fill="#e6e6e6">rutaflow.muertos    exchange    facturacion.muertos    queue    facturacion    []</text>
<text x="18" y="251" style="white-space: pre"><tspan fill="#7dd3a8">$ </tspan><tspan fill="#e6e6e6">node producir.mjs</tspan></text>
<text x="18" y="270" style="white-space: pre" fill="#e6e6e6">confirmado exchange=rutaflow.entregos rk=asignada cuerpo={"pedido":"1","conductor":"ana"}</text>
<text x="18" y="289" style="white-space: pre" fill="#e6e6e6">confirmado exchange=rutaflow.entregos rk=entregada cuerpo={"pedido":"1","total":4200}</text>
<text x="18" y="308" style="white-space: pre" fill="#e6e6e6">confirmado exchange=rutaflow.entregos rk=cancelada cuerpo={"pedido":"2","motivo":"cliente"}</text>
