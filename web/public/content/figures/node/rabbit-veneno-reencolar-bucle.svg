<text x="18" y="156" style="white-space: pre" fill="#e6e6e6">enviado rk=asignada cuerpo={"pedido":"99","conductor":"luis"}</text>
<text x="18" y="175" style="white-space: pre"><tspan fill="#7dd3a8">$ </tspan><tspan fill="#e6e6e6">COLA=repartidor VENENO=99 REENCOLAR=1 SEGUNDOS=3 node trabajar.mjs</tspan></text>
<text x="18" y="194" style="white-space: pre" fill="#e6e6e6">recibido cola=repartidor rk=asignada redelivered=false cuerpo={"pedido":"99","conductor":"luis"}</text>
<text x="18" y="213" style="white-space: pre" fill="#e6e6e6">FALLO pedido=99 no existe en la base: rechazo 1 reencolar=true</text>
