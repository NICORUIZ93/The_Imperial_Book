<text x="18" y="80" style="white-space: pre" fill="#e6e6e6">cola repartidor -&gt; [asignada, cancelada] dlq repartidor.muertos</text>
<text x="18" y="99" style="white-space: pre" fill="#e6e6e6">cola facturacion -&gt; [entregada] dlq facturacion.muertos</text>
<text x="18" y="118" style="white-space: pre" fill="#e6e6e6">exchange rutaflow.entregos (direct) y rutaflow.muertos (direct) declarados</text>
