<text x="18" y="251" style="white-space: pre" fill="#e6e6e6">FALLO pedido=99 no existe en la base: rechazo 2 reencolar=true</text>
<text x="18" y="270" style="white-space: pre" fill="#e6e6e6">recibido cola=repartidor rk=asignada redelivered=true cuerpo={"pedido":"99","conductor":"luis"}</text>
<text x="18" y="289" style="white-space: pre" fill="#e6e6e6">FALLO pedido=99 no existe en la base: rechazo 3 reencolar=true</text>
