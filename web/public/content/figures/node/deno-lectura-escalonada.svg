<title>Captura de terminal: cada capacidad se pide por separado: lectura, entorno</title>
<desc>Generado con scripts/render_terminal_capture.py el 2026-11-19. Cada linea 'deno ...' se ejecuto dentro de denoland/deno:2.9.8 con docker run --rm --network ruta -e TOKEN_ENTREGAS -e NO_COLOR=1 -v deno-lab-cache:/deno-dir -v "$PWD":/app -w /app denoland/deno:2.9.8 deno "$@". Comandos en orden: deno run --no-prompt leer.ts ; deno run --no-prompt --allow-read=./pedido.json leer.ts ; deno run --no-prompt --allow-read=./pedido.json --allow-env=TOKEN_ENTREGAS leer.ts. Codigo de salida final: 0.</desc>
