<title>Captura de terminal: el primer bun install respeta el package-lock de npm</title>
<desc>Generado con scripts/render_terminal_capture.py el 2026-11-19. Cada linea se ejecuto en la imagen oficial del runtime (oven/bun:1, node:24, denoland/deno:2.9.8, rabbitmq:4-management) montando la carpeta del laboratorio en /app con NO_COLOR=1. Comandos en orden: npm install zod@3.24.1 --no-audit --no-fund --loglevel=error ; npm ci --no-audit --no-fund --loglevel=error ; node -p 'require("zod/package.json").version' ; rm -rf node_modules ; bun install ; node -p 'require("zod/package.json").version' ; ls -1 | grep -E 'lock|json'. Codigo de salida final: 0.</desc>
