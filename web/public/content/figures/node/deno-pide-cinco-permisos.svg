<title>Captura de terminal: el mismo script de Node en Deno exige declarar accesos</title>
<desc>Generado con scripts/render_terminal_capture.py el 2026-11-19. Cada linea se ejecuto en la imagen oficial del runtime (oven/bun:1, node:24, denoland/deno:2.9.8, rabbitmq:4-management) montando la carpeta del laboratorio en /app con NO_COLOR=1. Comandos en orden: deno run --no-prompt src/prueba.mjs ; deno run --no-prompt --allow-net --allow-read --allow-write --allow-env --allow-run src/prueba.mjs | tail -1 ; bun src/prueba.mjs | tail -1. Codigo de salida final: 0.</desc>
