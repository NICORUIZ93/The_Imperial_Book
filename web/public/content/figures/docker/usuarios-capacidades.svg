<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 313" width="794" height="313" role="img" aria-label="Captura de terminal: capacidades.py como root, como nobody y como nobody + net_bind_service">
<title>Captura de terminal: capacidades.py como root, como nobody y como nobody + net_bind_service</title>
<desc>Generado con scripts/render_terminal_capture.py el 2026-11-18. Comandos en orden: python3 capacidades.py ; setpriv --reuid=65534 --regid=65534 --clear-groups python3 capacidades.py ; setpriv --reuid=65534 --regid=65534 --clear-groups --inh-caps +net_bind_service --ambient-caps +net_bind_service python3 capacidades.py. Código de salida final: 0.</desc>
<rect width="794" height="313" rx="8" fill="#1e1f24"/>
<rect width="794" height="30" rx="8" fill="#2b2d33"/><rect y="22" width="794" height="8" fill="#2b2d33"/><circle cx="18" cy="15.0" r="5.5" fill="#ff5f57"/><circle cx="36" cy="15.0" r="5.5" fill="#febc2e"/><circle cx="54" cy="15.0" r="5.5" fill="#28c840"/>
<text x="397.0" y="19.0" text-anchor="middle" fill="#9aa0a6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">capacidades.py como root, como nobody y como nobody + net_bind_service</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" xml:space="preserve" style="white-space: pre">
<text x="18" y="61" style="white-space: pre"><tspan fill="#7dd3a8">$ </tspan><tspan fill="#e6e6e6">python3 capacidades.py</tspan></text>
<text x="18" y="80" style="white-space: pre" fill="#e6e6e6">uid=0 capacidades efectivas: 40</text>
<text x="18" y="99" style="white-space: pre" fill="#e6e6e6">  de la muestra tiene: chown, dac_override, setpcap, net_bind_service, net_admin, sys_admin</text>
<text x="18" y="118" style="white-space: pre" fill="#e6e6e6">  ¿puede abrir el puerto 80? sí</text>
<text x="18" y="137" style="white-space: pre"><tspan fill="#7dd3a8">$ </tspan><tspan fill="#e6e6e6">setpriv --reuid=65534 --regid=65534 --clear-groups python3 capacidades.py</tspan></text>
<text x="18" y="156" style="white-space: pre" fill="#e6e6e6">uid=65534 capacidades efectivas: 0</text>
<text x="18" y="175" style="white-space: pre" fill="#e6e6e6">  de la muestra tiene: ninguna</text>
<text x="18" y="194" style="white-space: pre" fill="#e6e6e6">  ¿puede abrir el puerto 80? no (PermissionError)</text>
<text x="18" y="213" style="white-space: pre"><tspan fill="#7dd3a8">$ </tspan><tspan fill="#e6e6e6">setpriv --reuid=65534 --regid=65534 --clear-groups --inh-caps +net_bind_service --ambient-caps</tspan></text>
<text x="18" y="232" style="white-space: pre" fill="#e6e6e6"> +net_bind_service python3 capacidades.py</text>
<text x="18" y="251" style="white-space: pre" fill="#e6e6e6">uid=65534 capacidades efectivas: 1</text>
<text x="18" y="270" style="white-space: pre" fill="#e6e6e6">  de la muestra tiene: net_bind_service</text>
<text x="18" y="289" style="white-space: pre" fill="#e6e6e6">  ¿puede abrir el puerto 80? sí</text>
</g>
</svg>
