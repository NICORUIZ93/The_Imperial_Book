      <path d="M440 230A60 60 0 0 1 452 194" fill="none" stroke="#16213a" stroke-width="1.3"></path>
      <g stroke="#d9480f" stroke-width="3"><path d="M251 41L269 59M251 59L269 41"></path></g>
      <text x="270" y="40" fill="#d9480f" font-weight="600">−σ + jω_d</text>
      <text x="380" y="252" text-anchor="middle" fill="#1f7a4d" font-weight="600">σ = ζ ωn</text>
      <text x="250" y="145" text-anchor="end" fill="#d9480f" font-weight="600">ω_d = ωn √(1−ζ²)</text>
      <text x="395" y="122" fill="#2557c7" font-weight="600">ωn</text>
