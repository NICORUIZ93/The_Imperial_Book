<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Geometría de un polo complejo: sigma, omega d, omega n y theta" font-family="IBM Plex Sans, sans-serif" font-size="13.5"><rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
      <g stroke="#5b6579" stroke-width="1.3"><path d="M40 230H600"></path><path d="M500 20V280"></path></g>
      <path d="M500 230L260 50" stroke="#2557c7" stroke-width="2.2"></path>
