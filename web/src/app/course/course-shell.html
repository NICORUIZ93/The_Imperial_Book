<div class="shell" *ngIf="track() as t; else missing" [class.overview-mode]="isOverview()" [style.--track-color]="t.color">
  <header class="shell-topbar">
    <button #openSidebarButton class="icon-button mobile-only" [class.overview-only-hidden]="isOverview()" title="Abrir índice" aria-label="Abrir índice del curso" [attr.aria-expanded]="sidebarOpen()" (click)="sidebarOpen.set(true)"><lucide-icon [img]="icons.Menu" /></button>
    <a class="back-link" routerLink="/catalogo"><lucide-icon [img]="icons.ArrowLeft" /><span>Catálogo</span></a>
    <span class="shell-track-logo" *ngIf="trackLogo() as logo" aria-hidden="true" [style.background]="t.color"><img [src]="logo" alt="" /></span>
    <div class="shell-title">
      <strong>{{ t.shortName }}</strong>
      <div class="shell-progress" role="progressbar" aria-label="Progreso del track" aria-valuemin="0" aria-valuemax="100" [attr.aria-valuenow]="percent()"><span [style.width.%]="percent()"></span></div>
    </div>
    <button class="search-trigger" aria-label="Buscar cursos, módulos y temas" (click)="paletteService.open()">
      <lucide-icon [img]="icons.Search" /><span>Buscar</span><kbd>⌘K</kbd>
    </button>
    <button class="icon-button theme-toggle" (click)="themeService.toggle()" [attr.aria-label]="themeService.isDark() ? 'Activar modo claro' : 'Activar modo oscuro'" [title]="themeService.isDark() ? 'Modo claro' : 'Modo oscuro'">
      <lucide-icon [img]="themeService.isDark() ? icons.Sun : icons.Moon" />
    </button>
  </header>

  <div class="shell-body">
    <aside class="shell-sidebar" [class.open]="sidebarOpen()">
      <div class="shell-sidebar-header mobile-only">
        <strong>Índice del curso</strong>
        <button class="icon-button" aria-label="Cerrar índice del curso" (click)="closeSidebar()"><lucide-icon [img]="icons.X" /></button>
      </div>
      <p class="official-source" *ngIf="officialPath() as path">
        Guía oficial: <a [href]="path.sourceUrl" target="_blank" rel="noopener noreferrer">{{ path.source }} ↗</a>
      </p>
      <app-lesson-index [trackId]="t.id" />
    </aside>
    <div class="shell-scrim mobile-only" *ngIf="sidebarOpen()" (click)="closeSidebar()"></div>
    <main id="main-content" class="shell-main" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>

<ng-template #missing>
  <div class="shell-missing">
    <p>No encontramos este curso.</p>
    <a routerLink="/">Volver al catálogo</a>
  </div>
</ng-template>
